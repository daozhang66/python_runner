name: Build APK (Python 3.10, SciPy/scikit-learn)

# Chaquopy 的官方仓库里 SciPy / scikit-learn 只有 Python 3.8-3.10 的 Android 轮子。
# 这个工作流用 PYRUNNER_PYTHON=3.10 构建 release APK，安装后 pip 才能装上 scipy。

on:
  workflow_dispatch:
  push:
    branches: [build/python310-scipy]

jobs:
  build-apk-py310:
    runs-on: ubuntu-latest
    env:
      PYRUNNER_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 要求 buildPython 的大版本、小版本与应用的 Python 版本一致
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - run: flutter pub get

      - name: Create release signing key
        run: |
          keytool -genkeypair \
            -keystore android/ci-release.jks \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI,O=Python Runner,C=CN"
          {
            echo "PYRUNNER_RELEASE_STORE_FILE=ci-release.jks"
            echo "PYRUNNER_RELEASE_STORE_PASSWORD=ci-release-pass"
            echo "PYRUNNER_RELEASE_KEY_ALIAS=ci-release"
            echo "PYRUNNER_RELEASE_KEY_PASSWORD=ci-release-pass"
          } >> "$GITHUB_ENV"

      - name: Build release APK (Python 3.10)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: python-runner-py310-release
          path: build/app/outputs/flutter-apk/app-release.apk
