name: Build APKs (Python 3.11 + 3.10)

# Builds both Python variants in one run and uploads each as an artifact.
#   py3.11: project default.
#   py3.10: the Chaquopy repository only has SciPy / scikit-learn Android wheels
#           for Python 3.8-3.10, so this one can pip install them.
#
# Runs for pull requests and pushes to main (and by hand). Releases are built
# by release-apk.yml when a v* tag is pushed.
#
# Signing: uses the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS /
# KEY_PASSWORD repository secrets when they all exist (both APKs then share one
# signature and can update each other). Otherwise a throw-away CI key is
# generated per job, so APKs from different jobs/runs cannot update each other.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-apk:
    name: APK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.10']
    env:
      PYRUNNER_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs buildPython to have the same major.minor as the app's Python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - name: Install Android NDK (with retries)
        run: |
          NDK=28.2.13676358
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4 5; do
            rm -rf "$ANDROID_HOME/ndk/$NDK" "$ANDROID_HOME/.temp"
            if yes | "$SDKM" --install "ndk;$NDK" && [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ]; then
              echo "NDK $NDK installed"; exit 0
            fi
            echo "NDK install attempt $i failed, retrying..."; sleep $((i*10))
          done
          exit 1

      - run: flutter pub get

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using the repository signing key"
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            {
              echo "PYRUNNER_RELEASE_STORE_FILE=release.jks"
              echo "PYRUNNER_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "PYRUNNER_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "PYRUNNER_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets found, generating a throw-away CI key"
            keytool -genkeypair \
              -keystore android/ci-release.jks \
              -storepass ci-release-pass \
              -keypass ci-release-pass \
              -alias ci-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CI,O=Python Runner,C=CN"
            {
              echo "PYRUNNER_RELEASE_STORE_FILE=ci-release.jks"
              echo "PYRUNNER_RELEASE_STORE_PASSWORD=ci-release-pass"
              echo "PYRUNNER_RELEASE_KEY_ALIAS=ci-release"
              echo "PYRUNNER_RELEASE_KEY_PASSWORD=ci-release-pass"
            } >> "$GITHUB_ENV"
          fi

      # --dart-define lets the in-app updater pick the APK of the same Python version
      - name: Build release APK
        run: |
          ARGS="--release --dart-define=PYRUNNER_PYTHON=${{ matrix.python }}"
          flutter build apk $ARGS || { echo "Build failed, retrying once..."; flutter build apk $ARGS; }

      - name: Name the APK and write its checksum
        run: |
          OUT="PythonRunner-dev-${GITHUB_SHA::7}-py${{ matrix.python }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: PythonRunner-py${{ matrix.python }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
