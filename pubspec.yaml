name: python_runner
description: "Python运行器 - Android端Python脚本运行环境"
publish_to: 'none'

version: 1.5.3+27

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  # 代码编辑器（虚拟化渲染，高性能）
  re_editor:
    path: third_party/re_editor
  re_highlight: ^0.0.3
  highlight: ^0.7.0
  # 文件选择器
  file_picker: ^11.0.2
  # 本地配置存储
  shared_preferences: ^2.5.5
  # SQLite数据库
  sqflite: ^2.4.3
  path_provider: ^2.1.5
  path: ^1.9.0
  # 状态管理
  provider: ^6.1.2
  # 时间格式化
  intl: ^0.20.2
  # 权限管理
  permission_handler: ^12.0.3
  dynamic_color: ^1.8.1
  flutter_reorderable_grid_view: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/python_hooks/
