pluginManagement {
    def androidAgpVersion = providers.gradleProperty("androidAgpVersion").get()
    def kotlinGradlePluginVersion = providers.gradleProperty("kotlinGradlePluginVersion").get()

    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/central" }
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.android.application" ||
                requested.id.id == "com.android.library") {
                useModule("com.android.tools.build:gradle:${androidAgpVersion}")
            }
            if (requested.id.id == "kotlin-android" ||
                requested.id.id == "org.jetbrains.kotlin.android") {
                useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinGradlePluginVersion}")
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "${androidAgpVersion}" apply false
    id "com.android.library" version "${androidAgpVersion}" apply false
    id "org.jetbrains.kotlin.android" version "${kotlinGradlePluginVersion}" apply false
}

include ":app"
