def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFilePath = (
    project.findProperty("PYRUNNER_RELEASE_STORE_FILE")
        ?: System.getenv("PYRUNNER_RELEASE_STORE_FILE")
        ?: keystoreProperties.getProperty("storeFile", "daozhang.jks")
).toString()
def releaseStorePassword = (
    project.findProperty("PYRUNNER_RELEASE_STORE_PASSWORD")
        ?: System.getenv("PYRUNNER_RELEASE_STORE_PASSWORD")
        ?: keystoreProperties.getProperty("storePassword", "")
).toString()
def releaseKeyAlias = (
    project.findProperty("PYRUNNER_RELEASE_KEY_ALIAS")
        ?: System.getenv("PYRUNNER_RELEASE_KEY_ALIAS")
        ?: keystoreProperties.getProperty("keyAlias", "daozhang")
).toString()
def releaseKeyPassword = (
    project.findProperty("PYRUNNER_RELEASE_KEY_PASSWORD")
        ?: System.getenv("PYRUNNER_RELEASE_KEY_PASSWORD")
        ?: keystoreProperties.getProperty("keyPassword", "")
).toString()

android {
