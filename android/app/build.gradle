                install "certifi"
                install "urllib3"
                install "chardet"
                // 数据处理
                install "marshmallow"
                install "python-dateutil"
                install "pytz"
                // 加密与底层
                install "pycryptodome"
                install "cffi"
                install "six"
                install "cryptography"
                install "rsa"
                // 数据库
                install "tinydb"
                install "peewee"
