tasks.register("verifyReleaseManifestPolicy") {
    group = "verification"
    description = "Verify the merged release manifest keeps high-risk debug/internal capabilities out of release builds."

    doLast {
        def mergedManifest = fileTree(layout.buildDirectory.dir("intermediates").get().asFile) {
            include "**/AndroidManifest.xml"
        }.files.findAll { file ->
            def normalized = file.absolutePath.replace('\\', '/').toLowerCase(Locale.US)
            normalized.contains('/release/') &&
                (normalized.contains('merged_manifest') || normalized.contains('merged_manifests'))
        }.sort { a, b -> b.lastModified() <=> a.lastModified() }.find()

        if (mergedManifest == null || !mergedManifest.exists()) {
            throw new GradleException("Merged release manifest not found. Run processReleaseMainManifest before verifyReleaseManifestPolicy.")
        }

        def manifestText = mergedManifest.getText("UTF-8")
        def forbidden = [
            "android.permission.MANAGE_EXTERNAL_STORAGE",
            "android.permission.SYSTEM_ALERT_WINDOW",
            "bin.mt.file.content.MTDataFilesProvider",
            "bin.mt.file.content.MTDataFilesWakeUpActivity",
            "android:usesCleartextTraffic=\"true\""
        ]
        forbidden.each { value ->
            if (manifestText.contains(value)) {
                throw new GradleException("Release manifest policy violation: ${value} found in ${mergedManifest}")
            }
        }
        if (!manifestText.contains("android.permission.REQUEST_INSTALL_PACKAGES")) {
            throw new GradleException("Release manifest policy violation: REQUEST_INSTALL_PACKAGES missing; updater install flow depends on it.")
        }
        println "Release manifest policy verified: ${mergedManifest}"
    }
}

tasks.register("reportReleaseApkSize") {
    group = "verification"
    description = "Write a release APK size report and enforce the hard size budget."

    doLast {
        def apk = layout.buildDirectory.file("outputs/apk/release/app-release.apk").get().asFile
        if (!apk.exists()) {
            throw new GradleException("Release APK not found: ${apk}. Build packageRelease first.")
        }
        def warningMb = 170.0d
        def hardLimitMb = 190.0d
        def apkSizeMb = apk.length() / 1024.0d / 1024.0d
        if (apkSizeMb > hardLimitMb) {
            throw new GradleException(String.format(Locale.US, "Release APK %.1f MB exceeds hard limit %.1f MB", apkSizeMb, hardLimitMb))
        }
        if (apkSizeMb > warningMb) {
            logger.warn(String.format(Locale.US, "Release APK %.1f MB exceeds warning budget %.1f MB", apkSizeMb, warningMb))
        }

        def buckets = [
            "native-libs": 0L,
            "chaquopy-python": 0L,
            "linux-like-assets": 0L,
            "flutter-assets": 0L,
            "resources": 0L,
            "dex": 0L,
            "other": 0L,
        ]
        def zip = new java.util.zip.ZipFile(apk)
        zip.entries().each { entry ->
            if (entry.directory) return
            def name = entry.name
            def size = Math.max(entry.size, 0L)
            if (name.startsWith("lib/")) buckets["native-libs"] += size
            else if (name.contains("chaquopy") || name.startsWith("assets/chaquopy/")) buckets["chaquopy-python"] += size
            else if (name.startsWith("assets/flutter_assets/linux_like_libs/")) buckets["linux-like-assets"] += size
            else if (name.startsWith("assets/flutter_assets/")) buckets["flutter-assets"] += size
            else if (name.endsWith(".dex")) buckets["dex"] += size
            else if (name.startsWith("res/") || name == "resources.arsc") buckets["resources"] += size
            else buckets["other"] += size
        }
        zip.close()

        def reportDir = layout.buildDirectory.dir("reports/apk-size").get().asFile
        reportDir.mkdirs()
        def report = new File(reportDir, "release-size.txt")
        def lines = []
        lines << String.format(Locale.US, "APK: %s", apk.absolutePath)
        lines << String.format(Locale.US, "Total: %.1f MB", apkSizeMb)
        lines << String.format(Locale.US, "Warning budget: %.1f MB", warningMb)
        lines << String.format(Locale.US, "Hard limit: %.1f MB", hardLimitMb)
        lines << "Buckets:"
        buckets.each { key, value ->
            lines << String.format(Locale.US, "- %s: %.1f MB", key, value / 1024.0d / 1024.0d)
        }
        report.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), "UTF-8")
        println "Release APK size report written: ${report}"
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == "processReleaseMainManifest") {
        tasks.named("verifyReleaseManifestPolicy").configure { dependsOn task }
    }
    if (task.name == "assembleRelease") {
        task.dependsOn(tasks.named("verifyReleaseManifestPolicy"))
        task.finalizedBy(tasks.named("reportReleaseApkSize"))
    }
}

// Force proot .so files to be stored uncompressed so Android extracts them
// to nativeLibraryDir with execute permission, then re-sign the APK.
tasks.whenTaskAdded { task ->
    if (task.name == "packageRelease") {
        task.doLast {
            def apkDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
            def apk = new File(apkDir, "app-release.apk")
            if (!apk.exists()) return
            def targets = ["lib/arm64-v8a/libproot.so", "lib/arm64-v8a/liblinuxlike_loader.so", "lib/arm64-v8a/libtalloc2.so"] as Set

            // Step 1: rewrite zip with target .so entries stored uncompressed
            def unsignedApk = new File(apkDir, "app-release-unsigned.apk")
            def zin = new java.util.zip.ZipFile(apk)
            def zout = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(unsignedApk))
            zin.entries().each { entry ->
                def data = zin.getInputStream(entry).bytes
                if (targets.contains(entry.name)) {
                    def crc = new java.util.zip.CRC32()
                    crc.update(data)
                    def newEntry = new java.util.zip.ZipEntry(entry.name)
                    newEntry.method = java.util.zip.ZipEntry.STORED
                    newEntry.size = data.length
                    newEntry.compressedSize = data.length
                    newEntry.crc = crc.value
                    zout.putNextEntry(newEntry)
                } else {
                    // skip existing META-INF signature files — apksigner will add new ones
                    if (entry.name.startsWith("META-INF/") &&
                        (entry.name.endsWith(".SF") || entry.name.endsWith(".RSA") ||
                         entry.name.endsWith(".DSA") || entry.name == "META-INF/MANIFEST.MF")) {
                        return
                    }
                    def newEntry = new java.util.zip.ZipEntry(entry.name)
                    newEntry.method = entry.method
                    if (entry.method == java.util.zip.ZipEntry.STORED) {
                        newEntry.size = entry.size
                        newEntry.compressedSize = entry.compressedSize
                        newEntry.crc = entry.crc
                    }
                    zout.putNextEntry(newEntry)
                }
                zout.write(data)
                zout.closeEntry()
            }
            zin.close()
            zout.close()

            // Step 2: re-sign with apksigner
            if (!releaseStorePassword || !releaseKeyPassword || !releaseKeyAlias) {
                throw new GradleException("Release signing config missing. Set android/key.properties or PYRUNNER_RELEASE_* environment variables.")
            }
            def keystorePath = rootProject.file(releaseStoreFilePath).absolutePath
            def apksignerExt = System.getProperty("os.name").toLowerCase().contains("windows") ? ".bat" : ""
            def buildToolsDir = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}")
            def apksignerFile = new File(buildToolsDir, "apksigner${apksignerExt}")
            if (!apksignerFile.exists()) {
                def buildToolsRoot = new File(android.sdkDirectory, "build-tools")
                def candidates = buildToolsRoot.listFiles()
                    ?.sort { a, b -> b.name <=> a.name }
                    ?.collect { new File(it, "apksigner${apksignerExt}") }
                    ?: []
                apksignerFile = candidates.find { it.exists() } ?: apksignerFile
            }
            if (!apksignerFile.exists()) {
                throw new GradleException("apksigner not found under ${android.sdkDirectory}/build-tools")
            }
            exec {
                commandLine apksignerFile.absolutePath, "sign",
                    "--ks", keystorePath,
                    "--ks-pass", "pass:${releaseStorePassword}",
                    "--key-pass", "pass:${releaseKeyPassword}",
                    "--ks-key-alias", releaseKeyAlias,
                    "--v1-signing-enabled", "true",
                    "--v2-signing-enabled", "true",
                    "--out", apk.absolutePath,
                    unsignedApk.absolutePath
            }
            unsignedApk.delete()

            // Step 3: verify signature and .so compression
            exec {
                commandLine apksignerFile.absolutePath, "verify", "--verbose", "--print-certs", apk.absolutePath
            }
            def verifyZip = new java.util.zip.ZipFile(apk)
            targets.each { target ->
                def e = verifyZip.getEntry(target)
                if (e == null) {
                    verifyZip.close()
                    throw new GradleException("APK missing expected entry: ${target}")
                }
                if (e.method != java.util.zip.ZipEntry.STORED) {
                    verifyZip.close()
                    throw new GradleException("${target} is not STORED (uncompressed) in final APK")
                }
            }
            verifyZip.close()
            println "APK verified: signature valid, .so entries stored uncompressed"
        }
    }
}
