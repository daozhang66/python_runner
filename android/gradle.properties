org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
androidAgpVersion=8.11.1
kotlinGradlePluginVersion=2.2.20
# Kotlin 2.2 incremental caches can fail on Windows when Flutter plugin sources
# are under the Pub cache on C: and the project workspace is on D:.
kotlin.incremental=false
# Built-in Kotlin is enabled after migrating the app module away from
# explicitly applying the Kotlin Gradle Plugin in app/build.gradle.
android.builtInKotlin=true
# Keep Flutter's newer Android Gradle integration enabled for forward
# compatibility with future Flutter releases.
android.newDsl=true
